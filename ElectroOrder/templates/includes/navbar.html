<div class="nav-overlay" id="navOverlay"></div>

<aside class="sidebar" id="mainNav">
    <div class="sidebar-logo">
        <button class="sidebar-close" id="navCloseBtn" aria-label="Закрыть меню">
            <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 2l10 10M12 2L2 12"/></svg>
        </button>
        <a href="{% url 'dashboard:dashboard' %}" class="logo-mark">
            <div class="logo-icon">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                    <rect x="2" y="2" width="5" height="5" rx="1"></rect>
                    <rect x="9" y="2" width="5" height="5" rx="1"></rect>
                    <rect x="2" y="9" width="5" height="5" rx="1"></rect>
                    <path d="M11.5 9v5M9 11.5h5"></path>
                </svg>
            </div>
            <div>
                <div class="logo-text">ElectroOrder</div>
                <div class="logo-sub">CRM</div>
            </div>
        </a>
    </div>

    <div class="sidebar-nav">
        <div class="nav-section-label">Главная</div>
        <a href="{% url 'dashboard:dashboard' %}" class="nav-item {% if active_page == 'dashboard' %}active{% endif %}">
            <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                <rect x="2" y="2" width="5" height="5" rx="1"></rect>
                <rect x="9" y="2" width="5" height="3" rx="1"></rect>
                <rect x="2" y="9" width="5" height="5" rx="1"></rect>
                <rect x="9" y="7" width="5" height="7" rx="1"></rect>
            </svg>
            <span class="nav-label">Дашборд</span>
        </a>
        <a href="{% url 'market:home' %}" class="nav-item">
            <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                <path d="M2.5 6.5L8 2l5.5 4.5V13a1 1 0 0 1-1 1H3.5a1 1 0 0 1-1-1V6.5z"></path>
                <path d="M6 14V9.5h4V14"></path>
            </svg>
            <span class="nav-label">Магазин</span>
        </a>

        <div class="nav-section-label">Продажи</div>
        <a href="{% url 'dashboard:orders' %}" class="nav-item {% if active_page == 'orders' %}active{% endif %}">
            <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                <rect x="2" y="3" width="12" height="10" rx="1.5"></rect>
                <path d="M5 7h6M5 10h4"></path>
            </svg>
            <span class="nav-label">Заказы</span>
            <span class="nav-badge">{{ all_orders_count|default:0 }}</span>
        </a>
        <a href="{% url 'dashboard:products' %}" class="nav-item {% if active_page == 'products' %}active{% endif %}">
            <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                <path d="M2.5 5.5L8 2l5.5 3.5v5L8 14l-5.5-3.5v-5z"></path>
                <path d="M8 2v12M2.5 5.5L8 9l5.5-3.5"></path>
            </svg>
            <span class="nav-label">Товары</span>
        </a>

        <div class="nav-section-label">Маркетинг</div>
        <a href="{% url 'ads:advert' %}" class="nav-item {% if active_page == 'advert' %}active{% endif %}">
            <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                <path d="M3 10L12 3l-2.5 10-3-2.5-1.5 2.5L4.5 11 3 10z"></path>
            </svg>
            <span class="nav-label">Реклама</span>
        </a>
        <a href="{% url 'ads:analysis' %}" class="nav-item {% if active_page == 'analysis' %}active{% endif %}">
            <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                <path d="M2 12L5 8l3 2 3-4 3 2"></path>
                <path d="M2 12h12"></path>
            </svg>
            <span class="nav-label">Аналитика</span>
        </a>

        <div class="nav-section-label">Система</div>
        <a href="{% url 'dashboard:settings' %}" class="nav-item {% if active_page == 'settings' %}active{% endif %}">
            <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                <circle cx="8" cy="8" r="2.5"></circle>
                <path d="M8 1.8v1.7M8 12.5v1.7M14.2 8h-1.7M3.5 8H1.8M12.6 3.4l-1.2 1.2M4.6 11.4l-1.2 1.2M12.6 12.6l-1.2-1.2M4.6 4.6L3.4 3.4"></path>
            </svg>
            <span class="nav-label">Настройки</span>
        </a>
    </div>

    <div class="sidebar-footer">
        <div class="user-card">
            <div class="avatar">{{ user.username|slice:":1"|upper }}</div>
            <div class="user-info">
                <div class="user-name">{{ user.get_full_name|default:user.username }}</div>
                <div class="user-role">Администратор</div>
            </div>
        </div>
    </div>
</aside>
