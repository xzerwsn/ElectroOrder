<header class="topbar">
    <div class="topbar-left">
        <button class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="Открыть меню">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                <path d="M2 4h12M2 8h12M2 12h12"></path>
            </svg>
        </button>
        <div class="topbar-title">{{ title }}</div>
    </div>
    <div class="topbar-actions">
        <button class="theme-toggle" id="themeToggle" aria-label="Переключить тему">
            <svg class="theme-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
                <path d="M12.5 10.9A5.5 5.5 0 0 1 5.1 3.5 6 6 0 1 0 12.5 10.9z"></path>
            </svg>
        </button>

        <div class="topbar-dropdown-wrap">
            <button class="icon-btn" id="notificationsToggle" aria-label="Уведомления" aria-expanded="false" aria-controls="notificationsPanel">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
                    <path d="M6.7 13.5a1.5 1.5 0 0 0 2.6 0"></path>
                    <path d="M3.5 11.5h9c-.9-.7-1.5-1.8-1.5-3V7A3 3 0 0 0 5 7v1.5c0 1.2-.5 2.3-1.5 3z"></path>
                </svg>
                <span class="notif-dot"></span>
            </button>
            <div class="notifications-panel" id="notificationsPanel" hidden>
                <div class="notifications-panel__header">
                    <span>Уведомления</span>
                    <button type="button" class="notifications-clear" id="notificationsClear">Очистить</button>
                </div>
                <div class="notifications-list" id="notificationsList">
                    <div class="notification-item">
                        <div class="notification-item__dot is-info"></div>
                        <div class="notification-item__content">
                            <div class="notification-item__title">Система готова к работе</div>
                            <div class="notification-item__text">Интерфейс синхронизирован с текущими заказами и товарами.</div>
                        </div>
                    </div>
                    <div class="notification-item">
                        <div class="notification-item__dot is-warning"></div>
                        <div class="notification-item__content">
                            <div class="notification-item__title">Проверьте остатки</div>
                            <div class="notification-item__text">Товары с низким остатком лучше вынести в обработку.</div>
                        </div>
                    </div>
                </div>
                <div class="notifications-empty" id="notificationsEmpty" hidden>Новых уведомлений нет</div>
            </div>
        </div>

        <button class="icon-btn" aria-label="Профиль">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
                <circle cx="8" cy="5.5" r="2.5"></circle>
                <path d="M3.5 13c1-2 2.6-3 4.5-3s3.5 1 4.5 3"></path>
            </svg>
        </button>
    </div>
</header>
